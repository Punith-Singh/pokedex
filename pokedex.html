<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex 3D | Next Gen Discovery</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M3%2032a29%2029%200%200%201%2058%200Z%22%20fill%3D%22%23ef4444%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22none%22%20stroke%3D%22%23172033%22%20stroke-width%3D%225%22%2F%3E%3Cpath%20d%3D%22M4%2032h56%22%20stroke%3D%22%23172033%22%20stroke-width%3D%226%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2210%22%20fill%3D%22%23fff%22%20stroke%3D%22%23172033%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%224%22%20fill%3D%22%23e2e8f0%22%2F%3E%3C%2Fsvg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b1120; /* Darker Slate */
            color: #e2e8f0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1120 70%);
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0b1120;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
            border-radius: 4px;
        }

        /* 3D Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0; /* Behind content but accessible for mouse events if needed */
            opacity: 0.6;
            pointer-events: none; 
        }

        /* Card Styling */
        .poke-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(12px);
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            opacity: 0; /* For animation */
            animation: fadeUp 0.6s forwards;
        }
        
        .poke-card:hover {
            transform: translateY(-10px) scale(1.03);
            background: linear-gradient(145deg, rgba(51, 65, 85, 0.8), rgba(30, 41, 59, 0.9));
            border-color: rgba(96, 165, 250, 0.3);
            box-shadow: 0 20px 40px -10px rgba(59, 130, 246, 0.3);
        }

        .poke-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Type Badges - Gradients */
        .type-badge { text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .type-normal { background: linear-gradient(135deg, #A8A77A, #78775a); }
        .type-fire { background: linear-gradient(135deg, #EE8130, #c2521a); }
        .type-water { background: linear-gradient(135deg, #6390F0, #3b6bbd); }
        .type-electric { background: linear-gradient(135deg, #F7D02C, #bba41e); color: #000; text-shadow: none;}
        .type-grass { background: linear-gradient(135deg, #7AC74C, #50912b); }
        .type-ice { background: linear-gradient(135deg, #96D9D6, #6ca8a5); color: #000; text-shadow: none;}
        .type-fighting { background: linear-gradient(135deg, #C22E28, #8a1c17); }
        .type-poison { background: linear-gradient(135deg, #A33EA1, #732971); }
        .type-ground { background: linear-gradient(135deg, #E2BF65, #b3923d); }
        .type-flying { background: linear-gradient(135deg, #A98FF3, #7862bd); }
        .type-psychic { background: linear-gradient(135deg, #F95587, #c72e5d); }
        .type-bug { background: linear-gradient(135deg, #A6B91A, #788513); }
        .type-rock { background: linear-gradient(135deg, #B6A136, #857423); }
        .type-ghost { background: linear-gradient(135deg, #735797, #4a3663); }
        .type-dragon { background: linear-gradient(135deg, #6F35FC, #4119ad); }
        .type-dark { background: linear-gradient(135deg, #705746, #4a392d); }
        .type-steel { background: linear-gradient(135deg, #B7B7CE, #87879e); color: #000; text-shadow: none;}
        .type-fairy { background: linear-gradient(135deg, #D685AD, #a85c83); }

        /* Loader */
        .loader {
            border: 3px solid rgba(59, 130, 246, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Modal Animations */
        .modal-content-wrapper {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .stat-bar-fill {
            width: 0;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Glitch/Holo Text Effect for Title */
        .holo-text {
            background: linear-gradient(to right, #60a5fa, #e879f9, #60a5fa);
            background-size: 200% auto;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            animation: shine 3s linear infinite;
        }
        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <!-- 3D Background Container -->
    <div id="canvas-container"></div>

    <!-- Main Content -->
    <div class="relative z-10 min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="w-full py-10 px-4 flex flex-col items-center justify-center text-center space-y-6">
            <div class="relative">
                <div class="absolute -inset-1 bg-blue-500/20 rounded-full blur-xl"></div>
                <h1 class="relative text-6xl md:text-8xl font-black tracking-tighter holo-text">
                    POKÉDEX 3D
                </h1>
            </div>
            <p class="text-slate-400 text-lg font-light tracking-wide">
                Generation I Database <span class="mx-2 text-slate-600">|</span> Interactive Experience
            </p>
            
            <!-- Search Bar -->
            <div class="w-full max-w-xl relative group z-20">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 rounded-2xl blur opacity-30 group-hover:opacity-70 transition duration-300"></div>
                <div class="relative bg-slate-900/90 rounded-2xl flex items-center p-1 shadow-2xl backdrop-blur-xl border border-slate-700/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-400 ml-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="Search Pokémon by name..." 
                        class="w-full bg-transparent text-white border-none rounded-xl py-3 px-4 focus:outline-none placeholder-slate-500 text-lg"
                    >
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <main class="flex-grow container mx-auto px-4 py-8 relative z-10">
            <div id="loading-indicator" class="flex flex-col justify-center items-center py-20 space-y-4">
                <div class="loader"></div>
                <p class="text-slate-500 animate-pulse">Initializing Data Stream...</p>
            </div>
            
            <div id="pokemon-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 hidden pb-20">
                <!-- Cards will be injected here -->
            </div>
            
            <div id="no-results" class="hidden text-center py-20">
                <div class="text-6xl mb-4">🔭</div>
                <p class="text-2xl text-slate-400 font-light">No Pokémon found in this region.</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="py-8 text-center text-slate-600 text-xs font-medium tracking-widest uppercase relative z-20 border-t border-slate-800/50 bg-slate-900/30 backdrop-blur-sm">
            <p>Data Source: <a href="https://pokeapi.co/" target="_blank" class="text-blue-400 hover:text-blue-300 transition">PokéAPI</a></p>
            <p class="mt-2 opacity-50">Built with Three.js & Tailwind</p>
        </footer>

    </div>

    <!-- Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <!-- Dynamic Content Injected via JS -->
        <div id="modal-container" class="w-full max-w-3xl"></div>
    </div>

    <script>
        // --- Global Variables ---
        let allPokemonData = [];
        const TOTAL_POKEMON = 151; // Gen 1
        
        // --- Three.js 3D Background Setup ---
        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            const scene = new THREE.Scene();
            // Fog to blend 3D object into background at edges
            scene.fog = new THREE.FogExp2(0x0b1120, 0.02);
            
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance optimization
            container.appendChild(renderer.domElement);

            // Enhanced Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0x60a5fa, 1.5);
            dirLight.position.set(5, 5, 7);
            scene.add(dirLight);
            
            const rimLight = new THREE.SpotLight(0xe879f9, 2);
            rimLight.position.set(-5, 5, -5);
            rimLight.lookAt(0,0,0);
            scene.add(rimLight);

            // --- Procedural Pokéball ---
            const pokeballGroup = new THREE.Group();

            const sphereQuality = 64;
            
            // Materials with better PBR properties
            const redMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xef4444, 
                roughness: 0.1, 
                metalness: 0.6,
                emissive: 0x500000,
                emissiveIntensity: 0.2
            });
            const whiteMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                roughness: 0.1, 
                metalness: 0.6,
                emissive: 0x222222,
                emissiveIntensity: 0.2
            });
            const blackMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x0f172a, 
                roughness: 0.5, 
                metalness: 0.8 
            });
            
            const topGeo = new THREE.SphereGeometry(2, sphereQuality, sphereQuality, 0, Math.PI * 2, 0, Math.PI / 2);
            const topMesh = new THREE.Mesh(topGeo, redMaterial);
            
            const bottomGeo = new THREE.SphereGeometry(2, sphereQuality, sphereQuality, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
            const bottomMesh = new THREE.Mesh(bottomGeo, whiteMaterial);
            
            const bandGeo = new THREE.CylinderGeometry(1.98, 1.98, 0.25, sphereQuality, 1, true);
            const bandMesh = new THREE.Mesh(bandGeo, blackMaterial);
            // Use a black sphere slightly smaller to fill the gap nicely
            const innerCoreGeo = new THREE.SphereGeometry(1.95, 32, 32);
            const innerCoreMesh = new THREE.Mesh(innerCoreGeo, blackMaterial);

            const buttonGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 32);
            const buttonMesh = new THREE.Mesh(buttonGeo, whiteMaterial);
            buttonMesh.rotation.x = Math.PI / 2;
            buttonMesh.position.z = 1.92;

            const buttonRingGeo = new THREE.CylinderGeometry(0.75, 0.75, 0.25, 32);
            const buttonRingMesh = new THREE.Mesh(buttonRingGeo, blackMaterial);
            buttonRingMesh.rotation.x = Math.PI / 2;
            buttonRingMesh.position.z = 1.9;

            pokeballGroup.add(topMesh);
            pokeballGroup.add(bottomMesh);
            pokeballGroup.add(bandMesh);
            pokeballGroup.add(innerCoreMesh);
            pokeballGroup.add(buttonRingMesh);
            pokeballGroup.add(buttonMesh);

            scene.add(pokeballGroup);

            // Floating Particles
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 800;
            const posArray = new Float32Array(particlesCount * 3);
            
            for(let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 25;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.05,
                color: 0x3b82f6,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            let mouseX = 0;
            let mouseY = 0;
            
            function animate() {
                requestAnimationFrame(animate);
                
                // Idle rotation
                pokeballGroup.rotation.y += 0.003;
                pokeballGroup.rotation.z = Math.sin(Date.now() * 0.001) * 0.1;
                
                // Mouse parallax
                const targetRotX = mouseY * 0.5;
                const targetRotY = mouseX * 0.5;
                
                pokeballGroup.rotation.x += (targetRotX - pokeballGroup.rotation.x) * 0.05;
                pokeballGroup.rotation.y += (targetRotY - pokeballGroup.rotation.y * 0.1) * 0.05;

                particlesMesh.rotation.y -= 0.001;
                particlesMesh.rotation.x += 0.0005;

                renderer.render(scene, camera);
            }
            
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            });
        }

        // --- Data & UI ---

        const grid = document.getElementById('pokemon-grid');
        const loading = document.getElementById('loading-indicator');
        const searchInput = document.getElementById('search-input');
        const noResults = document.getElementById('no-results');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContainer = document.getElementById('modal-container');

        async function fetchPokemon() {
            try {
                const response = await fetch(`https://pokeapi.co/api/v2/pokemon?limit=${TOTAL_POKEMON}`);
                const data = await response.json();
                
                const detailsPromises = data.results.map(async (pokemon) => {
                    const res = await fetch(pokemon.url);
                    return res.json();
                });

                allPokemonData = await Promise.all(detailsPromises);
                
                renderPokemon(allPokemonData);
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
                
            } catch (error) {
                console.error("Error fetching data:", error);
                loading.innerHTML = `<p class="text-red-500 text-xl font-bold">Connection Interrupted. Please refresh.</p>`;
            }
        }

        function renderPokemon(list) {
            grid.innerHTML = '';
            
            if (list.length === 0) {
                grid.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            }
            
            grid.classList.remove('hidden');
            noResults.classList.add('hidden');

            list.forEach((poke, index) => {
                const card = document.createElement('div');
                // Stagger animation via inline style style animation-delay
                const delay = Math.min(index * 0.05, 1.5); 
                card.style.animationDelay = `${delay}s`;
                
                card.className = 'poke-card rounded-2xl p-6 cursor-pointer relative overflow-hidden group flex flex-col items-center';
                
                const imgUrl = poke.sprites.other['official-artwork'].front_default;
                const typesHtml = poke.types.map(t => 
                    `<span class="type-badge type-${t.type.name} text-xs font-bold px-3 py-1 rounded-full text-white uppercase tracking-wider shadow-md transform transition-transform hover:scale-110">${t.type.name}</span>`
                ).join('');

                // Background number watermark
                const idString = `#${poke.id.toString().padStart(3, '0')}`;

                card.innerHTML = `
                    <div class="absolute -top-4 -right-4 text-7xl font-black text-white opacity-5 select-none font-outline-2 z-0">
                        ${poke.id}
                    </div>
                    
                    <div class="relative z-10 w-full flex flex-col items-center">
                        <div class="w-40 h-40 relative flex justify-center items-center mb-4">
                            <div class="absolute inset-0 bg-white/5 rounded-full blur-2xl scale-75 group-hover:scale-100 transition-transform duration-500"></div>
                            <img src="${imgUrl}" alt="${poke.name}" class="w-full h-full object-contain drop-shadow-2xl z-10 transform group-hover:scale-115 transition-transform duration-500 cubic-bezier(0.34, 1.56, 0.64, 1)" loading="lazy">
                        </div>
                        
                        <h2 class="text-2xl font-bold capitalize text-white tracking-tight mb-3 group-hover:text-blue-400 transition-colors">${poke.name}</h2>
                        
                        <div class="flex flex-wrap justify-center gap-2 w-full">
                            ${typesHtml}
                        </div>
                        
                        <div class="mt-4 text-slate-500 text-xs font-mono bg-slate-900/50 px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                            Click for Data
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', () => openModal(poke));
                grid.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allPokemonData.filter(p => p.name.toLowerCase().includes(term));
            renderPokemon(filtered);
        });

        function openModal(pokemon) {
            const imgUrl = pokemon.sprites.other['official-artwork'].front_default;
            const idString = `#${pokemon.id.toString().padStart(3, '0')}`;
            
            const typesHtml = pokemon.types.map(t => 
                `<span class="type-badge type-${t.type.name} text-sm font-bold px-4 py-1.5 rounded-full text-white uppercase tracking-wide shadow-lg">${t.type.name}</span>`
            ).join('');
            
            const statsHtml = pokemon.stats.map(s => {
                const val = s.base_stat;
                const percentage = Math.min((val / 160) * 100, 100);
                let barColor = 'bg-slate-500';
                if(val >= 100) barColor = 'bg-green-500';
                else if(val >= 70) barColor = 'bg-blue-500';
                else if(val >= 40) barColor = 'bg-yellow-500';
                else barColor = 'bg-red-500';

                return `
                    <div class="mb-3">
                        <div class="flex justify-between text-sm mb-1">
                            <span class="text-slate-300 font-semibold uppercase text-xs tracking-wider">${s.stat.name.replace('special-', 'sp. ')}</span>
                            <span class="font-bold text-white">${val}</span>
                        </div>
                        <div class="w-full bg-slate-700/50 rounded-full h-2.5 overflow-hidden backdrop-blur-sm border border-slate-600/30">
                            <div class="${barColor} h-full rounded-full stat-bar-fill shadow-[0_0_10px_rgba(0,0,0,0.3)]" style="width: 0%" data-width="${percentage}%"></div>
                        </div>
                    </div>
                `;
            }).join('');

            modalContainer.innerHTML = `
                <div class="modal-content-wrapper relative bg-slate-800/90 border border-slate-600/50 rounded-3xl shadow-2xl overflow-hidden w-full mx-auto flex flex-col md:flex-row">
                    
                    <!-- Close Button -->
                    <button onclick="closeModal()" class="absolute top-4 right-4 z-50 bg-black/40 hover:bg-red-500/80 text-white rounded-full p-2 transition-colors backdrop-blur-sm border border-white/10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>

                    <!-- Left Side: Visuals -->
                    <div class="w-full md:w-5/12 relative flex flex-col items-center justify-center p-8 bg-gradient-to-br from-slate-800 to-slate-900">
                        <div class="absolute inset-0 opacity-30 type-${pokemon.types[0].type.name}" style="filter: blur(60px);"></div>
                        <div class="absolute top-6 left-6 text-5xl font-black text-white/10 select-none">${idString}</div>
                        
                        <div class="relative z-10">
                            <img src="${imgUrl}" class="w-64 h-64 object-contain drop-shadow-[0_10px_30px_rgba(0,0,0,0.5)] animate-[float_4s_ease-in-out_infinite]" alt="${pokemon.name}">
                        </div>
                        <div class="flex gap-3 mt-6 z-10">
                            ${typesHtml}
                        </div>
                    </div>

                    <!-- Right Side: Data -->
                    <div class="w-full md:w-7/12 p-8 bg-slate-900/60 backdrop-blur-xl">
                        <div class="flex justify-between items-end mb-6 border-b border-slate-700 pb-4">
                            <h2 class="text-4xl font-bold capitalize text-white tracking-tight">${pokemon.name}</h2>
                            <div class="text-right">
                                <span class="text-xs text-slate-400 uppercase block">Height</span>
                                <span class="text-lg font-mono text-white">${pokemon.height / 10}m</span>
                            </div>
                            <div class="text-right ml-6">
                                <span class="text-xs text-slate-400 uppercase block">Weight</span>
                                <span class="text-lg font-mono text-white">${pokemon.weight / 10}kg</span>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <h3 class="text-sm font-bold text-blue-400 uppercase tracking-widest mb-3">Base Statistics</h3>
                                <div class="space-y-1">
                                    ${statsHtml}
                                </div>
                            </div>
                            
                            <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50">
                                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Abilities</h3>
                                <div class="flex flex-wrap gap-2">
                                    ${pokemon.abilities.map(a => `
                                        <span class="px-3 py-1 bg-slate-700 text-slate-200 text-sm rounded-lg capitalize border border-slate-600 hover:border-slate-500 transition-colors">
                                            ${a.ability.name.replace('-', ' ')}
                                        </span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            modalOverlay.classList.remove('hidden');
            
            // Animation Sequence
            requestAnimationFrame(() => {
                modalOverlay.classList.remove('opacity-0');
                
                // Animate bars filling up
                setTimeout(() => {
                    const bars = document.querySelectorAll('.stat-bar-fill');
                    bars.forEach(bar => {
                        bar.style.width = bar.getAttribute('data-width');
                    });
                }, 150);
            });
            
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modalOverlay.classList.add('opacity-0');
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay || e.target === modalContainer) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        window.onload = function() {
            initThreeJS();
            fetchPokemon();
        };

    </script>
</body>
</html>
